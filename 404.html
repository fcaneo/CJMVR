<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0E0E10" />
<title>404 — Esta carta no está en el mazo · Club Juegos de Mesa Quinta Región</title>
<meta name="description" content="La página que buscas no existe en el mazo. Vuelve al inicio del Club Juegos de Mesa Quinta Región." />
<meta name="robots" content="noindex, follow" />

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='52' rx='10' fill='%23F5B700' stroke='%230E0E10' stroke-width='4'/%3E%3Ccircle cx='20' cy='20' r='5' fill='%230E0E10'/%3E%3Ccircle cx='44' cy='20' r='5' fill='%230E0E10'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%230E0E10'/%3E%3Ccircle cx='20' cy='44' r='5' fill='%230E0E10'/%3E%3Ccircle cx='44' cy='44' r='5' fill='%230E0E10'/%3E%3C/svg%3E" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: #0E0E10;
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    overflow-x: hidden;
    position: relative;
  }

  /* Grano */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0.06;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='3'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/></svg>");
    mix-blend-mode: overlay;
  }

  .grid-bg {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 64px 64px;
    pointer-events: none;
  }

  .display { font-family: 'Anton', sans-serif; letter-spacing: 0.01em; line-height: 0.9; text-transform: uppercase; }
  .mono { font-family: 'Space Mono', monospace; }

  .wrap {
    text-align: center;
    max-width: 640px;
    position: relative;
    z-index: 10;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 2rem;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #F5B700;
  }
  .eyebrow::before {
    content: "";
    width: 40px;
    height: 1px;
    background: #F5B700;
  }

  h1 {
    font-family: 'Anton', sans-serif;
    font-size: clamp(6rem, 22vw, 16rem);
    line-height: 0.85;
    color: #F5B700;
    letter-spacing: -0.02em;
    margin-bottom: 1.5rem;
    text-shadow: 6px 6px 0 #E91E63;
  }

  h2 {
    font-family: 'Anton', sans-serif;
    text-transform: uppercase;
    font-size: clamp(2rem, 5vw, 3.5rem);
    color: #fff;
    margin-bottom: 1rem;
    line-height: 1;
  }

  p {
    font-size: 1.125rem;
    color: rgba(255,255,255,0.75);
    line-height: 1.6;
    max-width: 480px;
    margin: 0 auto 2.5rem;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #F5B700;
    color: #0E0E10;
    padding: 1rem 2rem;
    font-weight: 700;
    font-family: 'DM Sans', sans-serif;
    text-decoration: none;
    letter-spacing: 0.02em;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .btn:hover {
    transform: translate(-3px, -3px);
    box-shadow: 6px 6px 0 0 #E91E63;
  }

  /* Dado giratorio gigante decorativo */
  .dice-bg {
    position: absolute;
    width: 240px;
    height: 240px;
    opacity: 0.08;
    z-index: 1;
    animation: spin 30s linear infinite;
  }
  .dice-tl { top: -60px; left: -60px; }
  .dice-br { bottom: -60px; right: -60px; }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* Pieza flotando */
  .floater {
    position: absolute;
    z-index: 2;
    pointer-events: none;
  }
  .f1 { top: 15%; left: 10%; width: 50px; height: 50px; background: #3FA9D6; transform: rotate(15deg); animation: bob 5s ease-in-out infinite; }
  .f2 { top: 70%; right: 15%; width: 40px; height: 40px; background: #E91E63; transform: rotate(-12deg); animation: bob 7s ease-in-out infinite; }
  .f3 { top: 25%; right: 8%; width: 30px; height: 30px; background: #F5B700; transform: rotate(45deg); animation: bob 6s ease-in-out infinite; }

  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(var(--r, 15deg)); }
    50% { transform: translateY(-15px) rotate(var(--r, 15deg)); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
    }
  }

  .footer-note {
    margin-top: 3rem;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #A0A0A8;
  }
</style>
</head>
<body>

<div class="grid-bg"></div>

<!-- Dados decorativos giratorios -->
<svg class="dice-bg dice-tl" viewBox="0 0 64 64" fill="none">
  <rect x="6" y="6" width="52" height="52" rx="10" fill="none" stroke="#F5B700" stroke-width="2"/>
  <circle cx="20" cy="20" r="3" fill="#F5B700"/>
  <circle cx="44" cy="20" r="3" fill="#F5B700"/>
  <circle cx="32" cy="32" r="3" fill="#F5B700"/>
  <circle cx="20" cy="44" r="3" fill="#F5B700"/>
  <circle cx="44" cy="44" r="3" fill="#F5B700"/>
</svg>
<svg class="dice-bg dice-br" viewBox="0 0 64 64" fill="none">
  <rect x="6" y="6" width="52" height="52" rx="10" fill="none" stroke="#E91E63" stroke-width="2"/>
  <circle cx="32" cy="32" r="3" fill="#E91E63"/>
</svg>

<!-- Floaters -->
<div class="floater f1"></div>
<div class="floater f2"></div>
<div class="floater f3"></div>

<main class="wrap">
  <div class="eyebrow">Error 404 · Carta no encontrada</div>

  <h1>404</h1>

  <h2>Esta carta no<br/>está en el mazo.</h2>

  <p>La página que buscas no existe — capaz se quedó debajo de la mesa, capaz alguien se la llevó prestada. Vuelve al inicio y sigamos jugando.</p>

  <a href="/CJMVR/" class="btn">
    Volver al inicio
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
  </a>

  <div class="footer-note">Club Juegos de Mesa Quinta Región · Viña del Mar</div>
</main>

</body>
</html>
